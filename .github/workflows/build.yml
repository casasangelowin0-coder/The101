name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project if uploaded as zip
        run: if [ -f GlobeRain101.zip ]; then unzip -q -o GlobeRain101.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          cd GlobeRain101 2>/dev/null || true
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GlobeRain101-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
